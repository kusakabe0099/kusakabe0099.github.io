<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>送信前チェック</title>
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="sendCheck.css">
</head>

<body>

<div class="container">

  <h1>送信確認</h1>

  <div class="subject-card">
    <span class="label">件名</span>
    <span id="subjectText"></span>
  </div>

  <div class="section">
    <div class="section-title">TO</div>
    <div class="section-body" id="toList"></div>
  </div>
  
  <div class="section">
    <div class="section-title">CC</div>
    <div class="section-body" id="ccList"></div>
  </div>
  
  <div class="section">
    <div class="section-title">BCC</div>
    <div class="section-body" id="bccList"></div>
  </div>
  
  <div class="section">
    <div class="section-title">添付ファイル</div>
    <div class="section-body" id="attachList"></div>
  </div>

  <div class="footer">

    <span id="progress">
      確認済み: 0/0
    </span>

    <div class="buttons">
      <button id="cancelButton" type="button" class="secondary">
        キャンセル
      </button>
      <button id="sendButton" type="button" disabled>
        確認して送信
      </button>
    </div>

    <div id="message" role="status"></div>

  </div>

</div>

<script type="text/javascript" src="shared.js"></script>
<script type="text/javascript" src="sendCheck.js"></script>

</body>
</html>
