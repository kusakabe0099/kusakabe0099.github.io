<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>送信前チェック</title>
  <!-- headタグ内に記述 -->
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script type="text/javascript" src="taskpane.js"></script>
</head>

<body>

<h2>送信前チェック</h2>

<label>
  <input type="checkbox" id="toCheck" disabled>
  宛先(To)
</label><br>

<label>
  <input type="checkbox" id="ccCheck" disabled>
  CC
</label><br>

<label>
  <input type="checkbox" id="bccCheck" disabled>
  BCC
</label><br>

<label>
  <input type="checkbox" id="subjectCheck" disabled>
  件名
</label><br>

<label>
  <input type="checkbox" id="attachCheck" disabled>
  添付ファイル
</label><br>

<button id="sendButton" disabled>
  送信OK
</button>

</body>
</html>
