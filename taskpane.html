<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>送信前チェック</title>
  <!-- headタグ内に記述 -->
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script type="text/javascript" src="taskpane.js"></script>
</head>

<body>

<div class="container">

  <h1>送信確認</h1>

  <div class="subject-card">
    <span class="label">件名</span>
    <span id="subjectText"></span>
  </div>

  <h3>TO</h3>
  <div id="toList"></div>
  
  <h3>CC</h3>
  <div id="ccList"></div>
  
  <h3>BCC</h3>
  <div id="bccList"></div>
  
  <h3>添付ファイル</h3>
  <div id="attachList"></div>

  <div class="footer">

    <span id="progress">
      確認済み: 0 / 0
    </span>

    <button id="sendButton" disabled>
      送信
    </button>

  </div>

</div>

</body>
</html>
