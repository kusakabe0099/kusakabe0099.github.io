<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>送信前チェック</title>
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script type="text/javascript" src="../js/shared.js" defer></script>
  <script type="text/javascript" src="../js/sendCheck.js" defer></script>
  <link rel="stylesheet" href="../css/sendCheck.css">
</head>

<body>

<div class="container">

  <!-- スクロールするのは、ここから添付ファイルのカードまで -->
  <div class="content">

  <header class="brand">
    <!-- alt="" は装飾扱い（隣の見出しで内容が伝わるため）。社名入りのロゴなら、会社名を入れてください -->
    <img class="logo" src="../img/logo-light.png" alt="" height="32">
    <h1>誤送信防止</h1>
  </header>

  <section class="card subject-card">
    <span class="label">件名</span>
    <span id="subjectText"></span>
  </section>

  <section class="card">
    <h3 class="card-head">TO</h3>
    <div class="card-body" id="toList"></div>
  </section>

  <section class="card">
    <h3 class="card-head">CC</h3>
    <div class="card-body" id="ccList"></div>
  </section>

  <section class="card">
    <h3 class="card-head">BCC</h3>
    <div class="card-body" id="bccList"></div>
  </section>

  <section class="card">
    <h3 class="card-head">添付ファイル</h3>
    <div class="card-body" id="attachList"></div>
  </section>

  </div><!-- /.content -->

  <!-- フッター：スクロールの範囲に含めず、常に下端に表示する -->
  <div class="footer">

    <span id="progress">
      確認済み: 0/0
    </span>

    <div class="buttons">
      <button id="cancelButton" type="button" class="secondary">
        キャンセル
      </button>
      <button id="sendButton" type="button" disabled>
        確認して送信
      </button>
    </div>

    <div id="message" role="status"></div>

  </div>

</div>

</body>
</html>
